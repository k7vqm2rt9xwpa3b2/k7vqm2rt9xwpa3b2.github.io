    <meta name="color-scheme" content="light dark" />
    <script>if(navigator.standalone===true){
document.documentElement.setAttribute("data-home-app","");
}
try{
const saved=localStorage.getItem("mode");
if(saved==="light"||saved==="dark"){
document.documentElement.setAttribute("data-mode",saved);
document.querySelector("meta[name=color-scheme]").content=saved;
}
}catch{
}
{
const root=document.documentElement;
const handOff=()=>{
if(!document.querySelector('meta[name="darkreader"]')){
return false;
}
if(!root.hasAttribute("data-mode")){
root.setAttribute("data-mode","dark");
root.setAttribute("data-mode-source","extension");
document.querySelector("meta[name=color-scheme]").content="dark";
}
const lock=document.createElement("meta");
lock.name="darkreader-lock";
document.head.append(lock);
return true;
};
if(!handOff()){
const watch=new MutationObserver(()=>handOff()&&watch.disconnect());
watch.observe(document.head,{childList:true});
addEventListener("load",()=>watch.disconnect());
}
}</script>
